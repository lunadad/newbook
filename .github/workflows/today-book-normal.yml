name: today-book-normal

# 정기 갱신은 로컬 헤르메스 cron이 담당한다(벤더별 실제 갱신 시각에 맞춘 창 + 4시간 안전망).
# GitHub Actions schedule은 상시 지연되어 갱신을 놓치므로 수동 트리거만 남긴다.
on:
  # schedule:
  #   - cron: "0 23 * * *" # 08:00 KST
  #   - cron: "0 11 * * *" # 20:00 KST
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/jobs/runTodayBook.ts
        env:
          CRON_INGEST_SECRET: ${{ secrets.CRON_INGEST_SECRET }}
          INGEST_BASE_URL: ${{ secrets.INGEST_BASE_URL }}
