name: today-book-highfreq

# 정기 갱신은 로컬 헤르메스 cron이 담당한다. 헤르메스는 분 단위 스케줄이 가능해
# 인프로세스 90분 폴링 루프 없이도 갱신 시각 창을 매분 확인할 수 있다.
on:
  # schedule:
  #   - cron: "20 9 * * 2,5" # 18:20 KST, 화·금
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/jobs/runTodayBook.ts --poll=highfreq
        env:
          CRON_INGEST_SECRET: ${{ secrets.CRON_INGEST_SECRET }}
          INGEST_BASE_URL: ${{ secrets.INGEST_BASE_URL }}
