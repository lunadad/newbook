name: new-releases

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/jobs/runNewReleases.ts
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          CRON_INGEST_SECRET: ${{ secrets.CRON_INGEST_SECRET }}
          INGEST_BASE_URL: ${{ secrets.INGEST_BASE_URL }}
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
